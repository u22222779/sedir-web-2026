services:
  postgres:
    image: postgres:13
    container_name: sedir-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Gadiel01
      POSTGRES_DB: Datos
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: "no"

volumes:
  postgres-data:
