<!-- ============ RADIO SEDIR ============ -->
<style>
  .radio-player-container {
    position: fixed;
    bottom: 184px;
    right: 32px;
    z-index: 150;
    display: flex;
    flex-direction: row-reverse;
    align-items: flex-end;
    gap: 15px;
  }

  .radio-player {
    background-color: #F09734;
    color: white;
    opacity: 0;
    visibility: hidden;
    transform: translateX(10px) scale(0.95);
    transform-origin: bottom right;
    transition: opacity 0.3s ease, transform 0.3s ease, visibility 0.3s;
    width: 260px;
    border-radius: 1rem;
    padding: 1rem;
    position: relative;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
  }

  .radio-player::after {
    content: '';
    position: absolute;
    bottom: 22px;
    right: -10px;
    width: 0;
    height: 0;
    border-top: 10px solid transparent;
    border-bottom: 10px solid transparent;
    border-left: 10px solid #F09734;
  }

  .radio-player-container:hover .radio-player {
    opacity: 1;
    visibility: visible;
    transform: translateX(0) scale(1);
  }

  audio {
    filter: invert(1) hue-rotate(180deg);
    border-radius: 0.5rem;
  }

  @media (max-width: 768px) {
    .radio-player-container {
      right: 20px;
      bottom: 174px;
    }
  }
</style>

<div class="radio-player-container">
  <button
    class="radio-button bg-[#F09734] text-white p-4 rounded-full shadow-xl hover:bg-[#d6852a] transition-colors flex items-center justify-center w-[64px] h-[64px] shrink-0"
    aria-label="Escuchar Radio SEDIR">
    <i class="fas fa-radio text-[32px]"></i>
  </button>

  <div class="radio-player">
    <h4 class="text-sm font-bold text-white mb-3 text-center font-display">
      Radio SEDIR en Vivo
    </h4>
    <audio controls class="h-10 w-full">
      <source src="https://radio.sistemasandinos.org/7516/stream" type="audio/mpeg">
      Tu navegador no soporta audio.
    </audio>
  </div>
</div>
