<!-- Enlace a tus fuentes de Montserrat y Franklin Gothic Demi -->
<link href="../activos/css/fonts.css" rel="stylesheet" />

<style>
    /* ==========================================
       1. VARIABLES, PALETA & TIPOGRAFÍAS
    ========================================== */
    :root {
        --color-primario: #00944a;       /* Verde Principal */
        --color-primario-oscuro: #006A49;/* Verde Oscuro */
        --color-tierra: #8C7855;         /* Tono Tierra / Cosecha */
        --color-secundario-verde: #009C63;
        --color-fondo-oscuro: #000306;   /* Fondo negro/azul profundo */
        --color-acento-naranja: #F09734; /* Naranja Vibrante */

        --font-montserrat: 'Montserrat', sans-serif;
        --font-franklin: 'Franklin Gothic Demi', 'Franklin Gothic', sans-serif;
        --hero-fondo-profesional: #17352f;
        --hero-fondo-profesional-oscuro: #0b1715;
    }

    .hero-home * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    /* ==========================================
       2. CONTENEDOR PANTALLA COMPLETA
    ========================================= */
    .hero-home {
        position: relative;
        width: 100%;
        height: 100vh;
        height: 100dvh; 
        min-height: 520px; 
        overflow: hidden;
        /* Fondo degradado verde institucional en lugar de negro puro mientras carga el video */
        background: linear-gradient(135deg, var(--hero-fondo-profesional) 0%, var(--hero-fondo-profesional-oscuro) 100%);
        box-shadow: 0 12px 30px rgba(0, 3, 6, 0.5);
    }

    #heroSlideshow {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
    }

    .hero-video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 35%; 
        /* Eliminamos opacity: 0 para que el video aparezca apenas el navegador reciba el primer fotograma */
    }
/* ==========================================
   2.1 ESTADO DE CARGA (spinner)
========================================== */
.hero-loading-state {
    position: absolute;
    inset: 0;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.75rem;
    color: rgba(255, 255, 255, 0.85);
    transition: opacity 0.4s ease;
    pointer-events: none;
}

.hero-loading-state.is-hidden {
    opacity: 0;
}

.hero-loading-state i {
    font-size: 2rem;
    color: var(--color-acento-naranja);
}

.hero-loading-state p {
    font-family: var(--font-montserrat);
    font-size: 0.85rem;
    font-weight: 500;
    letter-spacing: 0.02em;
}
    /* ==========================================
       3. OVERLAYS DEGRADADOS
    ========================================= */
    .hero-overlay {
        position: absolute;
        inset: 0;
        background: linear-gradient(
            135deg, 
            rgba(0, 3, 6, 0.05) 0%, 
            rgba(0, 3, 6, 0.25) 100%
        );
        pointer-events: none;
        z-index: 1;
    }

    .hero-content-gradient {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 60%; 
        background: linear-gradient(
            to top, 
            rgba(0, 3, 6, 0.55) 0%, 
            rgba(0, 3, 6, 0.15) 50%, 
            transparent 100%
        );
        pointer-events: none;
        z-index: 1;
    }

    .hero-top-gradient {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 140px;
        background: linear-gradient(to bottom, rgba(0, 3, 6, 0.35) 0%, transparent 100%);
        pointer-events: none;
        z-index: 1;
    }

    /* ==========================================
       4. CONTENIDO (ESCRITORIO: CENTRADO VERTICAL, IZQUIERDA)
    ========================================= */
    .hero-content {
        position: absolute;
        inset: 0;
        z-index: 2;
        display: flex;
        align-items: center; 
        justify-content: flex-start;
        padding: 0 8%;
    }

    .hero-info {
        width: 100%;
        max-width: 780px; 
        text-align: left;
        opacity: 0;
        animation: heroFadeIn 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        animation-delay: 0.3s;
    }

    .hero-eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        font-family: var(--font-franklin);
        font-weight: 400;
        font-size: 0.8rem;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: var(--color-acento-naranja);
        margin-bottom: 1.1rem;
        text-shadow: 0 2px 10px rgba(0, 3, 6, 0.7);
    }

    .hero-eyebrow::before {
        content: '';
        display: inline-block;
        width: 32px;
        height: 2px;
        background: var(--color-acento-naranja);
    }

    .hero-description {
        font-family: var(--font-montserrat);
        font-weight: 500;
        font-size: clamp(1.85rem, 3.6vw, 3.35rem); 
        line-height: 1.22; 
        letter-spacing: -0.012em;
        color: #FFFFFF;
        text-wrap: balance;
        text-shadow: 0 3px 14px rgba(0, 3, 6, 0.9); 
    }

    .text-highlight {
        font-family: var(--font-franklin);
        font-weight: 400; 
        color: var(--color-acento-naranja);
        letter-spacing: -0.01em; 
        text-shadow: 0 2px 12px rgba(240, 151, 52, 0.4), 0 3px 14px rgba(0, 3, 6, 0.95);
    }

    /* ==========================================
       5. ANIMACIONES
    ========================================= */
    @keyframes heroFadeIn {
        from {
            opacity: 0;
            transform: translateY(30px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @media (min-width: 769px) and (max-width: 1023px) {
        .hero-home {
            height: 65vh;/*SECCION VERDE DE LA PARTE DE ATRAS DEL VIDEO*/
            height: 65dvh;/*SECCION VERDE DE LA PARTE DE ATRAS DEL VIDEO*/
            min-height: 0;
            aspect-ratio: auto;
        }
    }

    /* ==========================================
       6. MÓVIL Y TABLET
    ========================================= */
    @media (max-width: 768px) {
        .hero-home {
            height: 100vh;
            height: 100dvh;
            min-height: 0;
            aspect-ratio: auto;
        }

        .hero-video {
            object-position: center 30%;
        }

        .hero-content {
            padding: 0 5%;
            display: flex;
            flex-direction: column;
            justify-content: center; 
            align-items: center;       
            text-align: center;
        }

        .hero-info {
            width: 100%;
            max-width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .hero-eyebrow {
            font-size: 0.7rem;
            letter-spacing: 0.26em;
            margin-bottom: 0.9rem;
        }

        .hero-eyebrow::before {
            width: 22px;
        }

        .hero-description {
            width: 100%;
            text-align: center;
            margin: 0 auto;
            font-size: clamp(1.75rem, 7.5vw, 2.5rem); 
            line-height: 1.22; 
            letter-spacing: -0.01em;
        }

        .hero-info::after {
            margin: 1.2rem auto 0; 
            width: 60px;
        }
    }

    @media (max-width: 380px) {
        .hero-eyebrow {
            font-size: 0.65rem;
            letter-spacing: 0.2em;
        }

        .hero-description {
            font-size: 1.5rem; 
            line-height: 1.22;
        }
    }
</style>

<section class="hero-home" aria-label="Innovación y Desarrollo para la Agricultura">
    <div id="heroSlideshow">
        <video
    id="heroVideo"
    class="hero-video"
    autoplay
    muted
    playsinline
    preload="auto"
    poster="../activos/videos/hero-poster.webp"
    aria-hidden="true"
>
    <source src="../activos/videos/VIDEO-hero.mp4" 
    type="video/mp4">

    Su navegador no soporta el video de fondo.
</video>
<div id="heroLoading" class="hero-loading-state">
    <i class="fa-solid fa-spinner fa-spin"></i>
    <p>Cargando video...</p>
</div>
    </div>

    <div class="hero-overlay"></div>
    <div class="hero-top-gradient"></div>
    <div class="hero-content-gradient"></div>

    <div class="hero-content">
        <div class="hero-info">
            <p class="hero-description">
                Innovación tecnológica para la
                <span class="text-highlight">agricultura familiar</span>
                y el
                <span class="text-highlight">desarrollo rural sostenible</span>
            </p>
        </div>
    </div>
</section>

<script>
    (function () {
    const video = document.getElementById("heroVideo");
    if (!video) return;

    const loadingState = document.getElementById("heroLoading");
    const ocultarCarga = function () {
        if (loadingState) loadingState.classList.add("is-hidden");
    };

    const INICIO = 6;
    const FIN = 88;

    video.addEventListener("loadedmetadata", function () {
        if (video.duration >= INICIO) {
            video.currentTime = INICIO;
        }
    });

    video.addEventListener("timeupdate", function () {
        if (video.currentTime >= FIN) {
            video.currentTime = INICIO;
            video.play().catch(() => {});
        }
    });

    video.addEventListener("ended", function () {
        video.currentTime = INICIO;
        video.play().catch(() => {});
    });

    video.addEventListener("canplay", function () {
        video.play().catch(error => {
            console.warn("Autoplay bloqueado:", error);
        });
    }, { once: true });

    // Nuevo: ocultar spinner apenas empiece a reproducirse
    video.addEventListener("playing", ocultarCarga, { once: true });

    // Nuevo: respaldo por si tarda o falla
    setTimeout(ocultarCarga, 6000);
})();
</script>
