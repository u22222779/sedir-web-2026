<!DOCTYPE html>
<html lang="es" class="scroll-smooth">

<head>
    <title>.:: SEDIR - Últimas Noticias ::.</title>
    <link rel="icon" href="../activos/img_logos/logo-sedir-links.png" type="image/x-icon">

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="description"
        content="Últimas noticias, proyectos y novedades del Servicio para el Desarrollo Integral Rural (SEDIR)." />

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#00944A",
                        "primary-dark": "#006A49",
                        "primary-alt": "#009C63",
                        brown: "#8C7855",
                        secondary: "#F09734",
                        ink: "#000306",
                        cream: "#FBF7EE",
                        'sedir-green': '#00944a',
                        'sedir-dark-green': '#006a49',
                        'sedir-orange': '#f09734',
                        'sedir-gray': '#4a5568',
                        'sedir-light-gray': '#f7fafc',
                    },
                    fontFamily: {
                        display: ["Montserrat", "sans-serif"],
                        body: ["Montserrat Light", "sans-serif"]
                    }
                }
            }
        };
    </script>

    <link href="../activos/css/fonts.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet" />
    <link href="../activos/css/style.css" rel="stylesheet" />
    <link href="../activos/css/navbar.css" rel="stylesheet" />
    <link href="../activos/css/hero.css" rel="stylesheet" />
    <link href="../activos/css/noticias.css" rel="stylesheet" />
    <link href="../activos/css/cards.css" rel="stylesheet" />
    <link href="../activos/css/footer.css" rel="stylesheet" />
    <link href="../activos/css/responsive.css" rel="stylesheet" />

    <style>
        body {
            font-family: 'Montserrat Light', sans-serif;
        }

        h1,
        h2,
        h3,
        h4,
        h5,
        h6 {
            font-family: 'Montserrat', sans-serif;
        }

        html,
        body {
            overflow-x: hidden;
            width: 100%;
        }
    </style>

    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" />
</head>

<body class="bg-white text-gray-800 noticias-page antialiased min-h-screen flex flex-col justify-between">
    <!-- Componente Navbar -->
    <header id="navbar-container" class="navbar-loading sticky top-0 z-50 w-full"
        data-component="/components/navbar.html"></header>

    <!-- Hero Noticias -->
    <header class="relative w-full h-[400px] md:h-[430px] rounded-bl-none flex items-center justify-center overflow-hidden"
      style="background: #006a49">

      <!-- Imagen de fondo -->
      <div class="absolute inset-0 z-0">
        <img src="/activos/img_noticias/P1340490.JPG" alt="Últimas Noticias"
          class="w-full h-full object-cover opacity-60" />
      </div>

      <!-- Capa oscura sutil, como en el original -->
      <div class="absolute inset-0 bg-transparent z-10"></div>

<!-- Contenido -->
<div class="relative z-20 w-full max-w-[1606px] mx-auto px-6 md:px-12 lg:px-[100px] flex items-center">
    <div class="w-full md:w-1/2 text-left">
        <h1 class="font-montserrat text-3xl sm:text-4xl md:text-[44px] text-white font-black leading-none"
            style="-webkit-text-stroke: 1px white; text-stroke: 1px white;">
            Noticias
        </h1>
        <p class="font-montserrat italic text-lg sm:text-xl md:text-[22px] text-white leading-snug mt-3">
            <span class="font-semibold">Resultado</span>
            <span class="text-[#F09734] not-italic font-bold"> del trabajo técnico junto</span>
            <span class="font-semibold">a nuestros productores.</span>
        </p>
    </div>
</div>
    </header>

    <!-- Contenido Principal -->
    <main
        class="w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-12 lg:py-16 space-y-8 sm:space-y-12 flex-grow">

        <section id="filtros-container" class="w-full overflow-x-auto pb-2 scrollbar-none"
            data-component="/components/filtros-noticias.html"></section>

        <div id="cards-template-container" data-component="/components/card-noticia.html" hidden aria-hidden="true">
        </div>

        <section id="news-cards-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 sm:gap-8 w-full"
            aria-label="Listado de noticias y artículos">

            <div id="loading-state"
                class="col-span-full flex flex-col items-center justify-center py-12 text-gray-400 space-y-3">
                <i class="fa-solid fa-spinner fa-spin text-3xl text-primary"></i>
                <p class="text-sm font-medium animate-pulse">Cargando noticias...</p>
            </div>

        </section>
    </main>

    <footer id="footer-container" class="w-full mt-auto" data-component="/components/footer.html"></footer>
  <!-- BEGIN: Radio Component -->
  <div id="radio-container" data-component="/components/radio.html"></div>
   
  <!-- BEGIN: WhatsApp Component -->
  <div id="whatsapp-container" data-component="/components/whatsapp.html"></div>
  
  <!-- Facebook Component -->
  <div id="facebook-container" data-component="/components/facebook.html"></div>

    <script src="/activos/js/components.js" defer></script>
    <script src="/activos/js/navbar.js" defer></script>
    <script src="/activos/js/filtros.js" defer></script>
    <script src="/activos/js/noticias.js" defer></script>
    <script src="/activos/js/main.js" defer></script>
</body>

</html>
