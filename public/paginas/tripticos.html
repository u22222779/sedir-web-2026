<!DOCTYPE html>
<html lang="es">
  <head>
  <title>.:: SEDIR ::.</title>
  <link rel="icon" href="../activos/img_logos/logo-sedir-links.png" type="image/x-icon">

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="../activos/css/fonts.css" rel="stylesheet" />

  <link href="/activos/css/style.css" rel="stylesheet" />
  <link href="/activos/css/navbar.css" rel="stylesheet" />
  <link href="/activos/css/footer.css" rel="stylesheet" />
  <link href="/activos/css/responsive.css" rel="stylesheet" />
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#006b34",
            "primary-dark": "#0b4f30",
            secondary: "#F09734",
            cream: "#F6F1E7",
            mint: "#EEF5EC"
          },
          fontFamily: {
            display: ["Montserrat", "sans-serif"],
            body: ["Franklin Gothic Demi", "sans-serif"]
          }
        }
      }
    };
  </script>
  <style>
    .hero-publicaciones-bg {
      background: linear-gradient(135deg, #0b6b45 0%, #0a5c3b 60%, #094c32 100%);
    }
  </style>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body class="bg-white text-gray-900 font-body antialiased">
<!-- BEGIN: Navigation Component -->
  <div id="navbar-container" class="navbar-loading" data-component="/components/navbar.html"></div>
<script>
(function () {
  try {
    var html = sessionStorage.getItem('sedirNavbarHTML');
    var el = document.getElementById('navbar-container');
    if (html && el) {
      el.innerHTML = html;
      el.classList.remove('navbar-loading');
      el.classList.add('navbar-loaded');
    }
  } catch (e) {}
})();
</script>
  <!-- END: Navigation Component -->

<header
  class="relative w-full h-[400px] md:h-[430px] flex items-center justify-center overflow-hidden"
  style="background: #006a49">
  <div class="absolute inset-0 z-0">
    <img src="/activos/img_quienessomos/MIEL.jpg" alt="Trípticos" class="w-full h-full object-cover opacity-60" />
  </div>
  <div class="absolute inset-0 bg-transparent z-10"></div>
  <div class="relative z-20 w-full max-w-[1606px] mx-auto px-6 md:px-12 lg:px-[100px] flex items-center">
    <div class="w-full md:w-1/2 text-left translate-y-16">
    <button onclick="history.back()"
        class="absolute -top-16 left-0 inline-flex items-center gap-2 bg-transparent border-2 border-white text-white text-sm font-bold px-6 py-2 rounded-full hover:bg-white hover:text-[#006a49] transition-all overflow-hidden group">
                    <span
                        class="material-symbols-outlined text-lg group-hover:-translate-x-1 transition-transform">chevron_left</span>
                    Volver
                </button>
      <h1 class="font-montserrat text-3xl sm:text-4xl md:text-[44px] text-white font-extrabold leading-none">
        Trípticos 
        <span class="text-[#F09734]">Informativos</span>
      </h1>
      <p class="font-montserrat italic text-lg sm:text-xl md:text-[22px] text-white font-semibold leading-snug mt-3">
        Información técnica resumida para el día a día del campo.
      </p>
    </div>
  </div>
</header>

  <main class="max-w-7xl mx-auto px-6 md:px-10 py-12 md:py-16">
    <div id="galeria-tripticos" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      <p class="text-sm text-gray-500 col-span-full">Cargando trípticos...</p>
    </div>
  </main>

    <!-- BEGIN: Footer Component -->
  <div id="footer-container" data-component="/components/footer.html"></div>
  <!-- END: Footer Component -->

  <!-- BEGIN: Radio Component -->
  <div id="radio-container" data-component="/components/radio.html"></div>
   
  <!-- BEGIN: WhatsApp Component -->
  <div id="whatsapp-container" data-component="/components/whatsapp.html"></div>
  
  <!-- Facebook Component -->
  <div id="facebook-container" data-component="/components/facebook.html"></div>

  <script src="/activos/js/components.js" defer></script>
  <script src="/activos/js/navbar.js" defer></script>
  <script src="/activos/js/publicaciones.js" defer></script>
  <script src="/activos/js/main.js" defer></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      window.cargarGaleriaPorTipo('triptico', 'galeria-tripticos');
    });
  </script>
</body>
</html>
