<!DOCTYPE html>
<html lang="es">

<head>
  <title>.:: SEDIR ::.</title>
  <link rel="icon" href="../activos/img_logos/logo-sedir-links.png" type="image/x-icon">

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Panel Administrativo - SEDIR</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../activos/css/style.css" />
  <style>
    body {
      font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Arial;
      overflow-x: hidden;
    }

    .sidebar {
      width: 280px;
      transition: .3s;
    }

    .content {
      margin-left: 300px;
      transition: .3s;
    }

    .card {
      border-radius: 20px;
      box-shadow: 0 14px 40px rgba(15, 23, 42, .08);
    }

    .nav-link.active {
      background: #f0faf4;
      color: #00944a;
      font-weight: 700;
    }

    .field {
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 12px 14px;
      width: 100%;
    }

    .field:focus {
      outline: none;
      border-color: #00944a;
      box-shadow: 0 0 0 4px rgba(0, 148, 74, .08);
    }

    .dashboard-kpi {
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, #ffffff 0%, #f8fbf9 100%);
    }

    .dashboard-kpi::after {
      content: '';
      position: absolute;
      inset: auto -30px -30px auto;
      width: 120px;
      height: 120px;
      border-radius: 999px;
      background: rgba(0, 148, 74, 0.08);
    }

    .dashboard-list-item {
      border: 1px solid #e9f3ed;
      border-radius: 14px;
      background: #fbfdfb;
    }

    .btn-primary {
      background: #00944a;
      color: #fff;
    }

    .btn-primary:hover {
      background: #007a3d;
    }

    /* ==========================
   EDITOR DE TEXTO ENRIQUECIDO (Contenido de noticias)
========================== */

    .richtext-wrapper {
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      overflow: hidden;
    }

    .richtext-wrapper:focus-within {
      border-color: #00944a;
      box-shadow: 0 0 0 4px rgba(0, 148, 74, .08);
    }

    .richtext-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      padding: 8px;
      background: #f8fafc;
      border-bottom: 1px solid #e5e7eb;
    }

    .richtext-btn {
      border: 1px solid transparent;
      background: transparent;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      cursor: pointer;
      line-height: 1;
    }

    .richtext-btn:hover {
      background: #eef2f7;
      border-color: #e2e8f0;
    }

    .richtext-btn.is-active {
      background: #e6f6ec;
      border-color: #00944a;
      color: #00733d;
    }

    .richtext-sep {
      width: 1px;
      background: #e5e7eb;
      margin: 4px 4px;
    }

    .richtext-editor {
      min-height: 200px;
      max-height: 480px;
      overflow-y: auto;
      padding: 14px 16px;
      outline: none;
      font-size: 15px;
      line-height: 1.6;
      color: #1e293b;
    }

    .richtext-editor:empty::before {
      content: attr(data-placeholder);
      color: #94a3b8;
    }

    .richtext-editor h2 {
      font-size: 1.4em;
      font-weight: 700;
      margin: .6em 0 .3em;
    }

    .richtext-editor h3 {
      font-size: 1.15em;
      font-weight: 700;
      margin: .6em 0 .3em;
    }

    .richtext-editor p {
      margin: 0 0 .8em;
    }

    .richtext-editor ul,
    .richtext-editor ol {
      margin: 0 0 .8em 1.4em;
    }

    .richtext-editor ul,
    .richtext-editor ol {
      margin: 0 0 .8em;
      padding-left: 1.4em;
    }

    .richtext-editor ul {
      list-style: disc;
    }

    .richtext-editor ol {
      list-style: decimal;
    }

    .richtext-editor li {
      margin: 0 0 .3em;
    }

    .richtext-editor a {
      color: #00944a;
      text-decoration: underline;
    }

    .richtext-editor img {
      max-width: 100%;
      border-radius: 12px;
      margin: .6em 0;
      display: block;
    }

    .richtext-editor img.richtext-img-selected {
      outline: 3px solid #00944a;
      outline-offset: 2px;
      cursor: pointer;
    }

    /* ==========================
   CAMPO DE IMAGEN (URL + subida de archivo)
========================== */

    .image-upload-field {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .image-upload-row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .image-upload-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px dashed #cbd5e1;
      border-radius: 12px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      background: #f8fafc;
      cursor: pointer;
    }

    .image-upload-btn:hover {
      border-color: #00944a;
      color: #00733d;
      background: #f0faf4;
    }

    .image-upload-status {
      font-size: 12px;
      font-weight: 600;
      color: #64748b;
    }

    .image-upload-status.is-uploading {
      color: #b45309;
    }

    .image-upload-status.is-error {
      color: #dc2626;
    }

    .image-upload-status.is-success {
      color: #00733d;
    }

    .image-upload-preview-wrap {
      position: relative;
      width: fit-content;
    }

    .image-upload-preview {
      max-width: 220px;
      max-height: 140px;
      border-radius: 12px;
      border: 1px solid #e5e7eb;
      display: block;
      object-fit: cover;
    }

    .image-upload-remove {
      position: absolute;
      top: -8px;
      right: -8px;
      background: #dc2626;
      color: #fff;
      border: 2px solid #fff;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0, 0, 0, .2);
    }

    .image-upload-remove:hover {
      background: #b91c1c;
    }


    /* ==========================
   RESPONSIVE
========================== */

    @media (max-width:1024px) {

      .sidebar {
        position: relative !important;
        width: 100%;
        height: auto;
        border-right: none;
        border-bottom: 1px solid #e5e7eb;
      }

      .content {
        margin-left: 0;
        width: 100%;
        padding: 20px;
      }

    }

    @media (max-width:768px) {

      header {
        text-align: center;
      }

      h1 {
        font-size: 1.8rem !important;
      }

      .card {
        padding: 20px !important;
      }

      table {
        min-width: 700px;
      }

      .overflow-x-auto {
        overflow-x: auto;
      }

      .field {
        font-size: 16px;
      }

    }

    @media (max-width:640px) {

      .content {
        padding: 15px;
      }

      h1 {
        font-size: 1.5rem !important;
      }

      .sidebar {
        padding: 18px;
      }

      .btn-primary {
        width: 100%;
      }

    }
  </style>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body class="bg-slate-50 min-h-screen">
  <div class="sidebar lg:fixed lg:inset-y-0 lg:left-0 bg-white border-r border-slate-100 p-6 overflow-y-auto">
    <div class="mb-5 text-center">
      <img src="../activos/img_logos/logo-msi.png" alt="SEDIR" class="h-12 object-contain mx-auto" />
      <p class="mt-3 text-xs uppercase tracking-[0.3em] text-slate-400">Panel admin</p>
    </div>
    <nav class="space-y-2 text-slate-700">
      <a href="#" data-view="dashboard" class="nav-link block py-2.5 px-3 rounded-xl hover:bg-slate-50">Dashboard</a>
      <a href="#" data-view="noticias" class="nav-link block py-2.5 px-3 rounded-xl hover:bg-slate-50">Noticias</a>
      <a href="#" data-view="proyectos" class="nav-link block py-2.5 px-3 rounded-xl hover:bg-slate-50">Proyectos</a>
      <a href="#" data-view="webinars" class="nav-link block py-2.5 px-3 rounded-xl hover:bg-slate-50">Webinars</a>
    </nav>
    <div class="mt-8 pt-6 border-t border-slate-100 space-y-3">
      <div class="text-sm text-slate-500">
        Sesión activa: <span id="session-user" class="font-semibold text-slate-700">-</span>
      </div>
      <a href="/paginas/login.html" id="logout-link" class="inline-flex text-sm font-semibold text-red-600">Cerrar
        sesión</a>
    </div>
  </div>

  <main class="content p-4 md:p-6 lg:p-8">
    <header class="flex flex-col gap-3 md:flex-row md:items-end md:justify-between mb-8">
      <h1 class="text-3xl font-bold text-slate-900">CRUD de noticias y proyectos</h1>
    </header>
    <div id="status-line" class="fixed top-6 right-6 z-50 opacity-0 pointer-events-none translate-y-[-8px] transition-all duration-300 bg-emerald-600 text-white text-sm font-semibold px-5 py-3 rounded-2xl shadow-xl">
      Listo para administrar contenido público
    </div>

    <section id="main-content" class="space-y-6"></section>
  </main>

  <script>
    const AUTH_TOKEN_KEY = 'sedir_admin_token';
    const AUTH_USER_KEY = 'sedir_admin_user';

    const appState = {
      view: 'dashboard',
      noticias: [],
      proyectos: [],
      webinars: [],
      editingNoticiaId: null,
      editingProyectoId: null,
      editingWebinarYoutubeId: null,
      authUser: null,
    };

    const content = document.getElementById('main-content');
    const statusLine = document.getElementById('status-line');
    const sessionUser = document.getElementById('session-user');
    const navLinks = Array.from(document.querySelectorAll('[data-view]'));

    function getToken() {
      return localStorage.getItem(AUTH_TOKEN_KEY) || '';
    }

    function clearAuth() {
      localStorage.removeItem(AUTH_TOKEN_KEY);
      localStorage.removeItem(AUTH_USER_KEY);
    }

    function updateSessionUserLabel() {
      sessionUser.textContent = appState.authUser?.nombre || appState.authUser?.email || 'admin';
    }

    document.getElementById('logout-link').addEventListener('click', function () {
      clearAuth();
    });

    let statusTimeoutId = null;

    function setStatus(message) {
      statusLine.textContent = message;
      statusLine.classList.remove('opacity-0', 'translate-y-[-8px]', 'pointer-events-none');

      if (statusTimeoutId) {
        clearTimeout(statusTimeoutId);
      }

      statusTimeoutId = setTimeout(function () {
        statusLine.classList.add('opacity-0', 'translate-y-[-8px]', 'pointer-events-none');
      }, 2500);
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function stripHtml(value) {
      return String(value ?? '')
        .replace(/<\/(p|div|br|li|h[1-6])\s*>/gi, ' ')
        .replace(/<br\s*\/?>/gi, ' ')
        .replace(/<[^>]*>/g, '')
        .replace(/&nbsp;/g, ' ')
        .replace(/&amp;/g, '&')
        .replace(/&lt;/g, '<')
        .replace(/&gt;/g, '>')
        .replace(/&quot;/g, '"')
        .replace(/&#39;/g, "'")
        .replace(/\s+/g, ' ')
        .trim();
    }

    function formatDate(value) {
      if (!value) return 'Sin fecha';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return String(value);
      return date.toLocaleDateString('es-PE', { year: 'numeric', month: 'short', day: '2-digit' });
    }

    function formatDateForInput(value) {
      if (!value) return '';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return '';
      return date.toISOString().slice(0, 10);
    }

    async function requestJson(path, options) {
      const token = getToken();
      const providedHeaders = options?.headers || {};
      const headers = {
        'Content-Type': 'application/json',
        ...providedHeaders,
      };

      if (token) {
        headers.Authorization = `Bearer ${token}`;
      }

      const response = await fetch(path, {
        ...options,
        headers,
      });

      const isJson = response.headers.get('content-type')?.includes('application/json');
      const data = isJson ? await response.json() : null;

      if (!response.ok) {
        if (response.status === 401) {
          clearAuth();
          window.location.href = '/paginas/login.html';
        }

        const message = data?.error || 'No se pudo completar la operación';
        const details = Array.isArray(data?.missingFields) && data.missingFields.length
          ? ` Faltan: ${data.missingFields.join(', ')}`
          : '';
        throw new Error(message + details);
      }

      return data;
    }

    async function ensureAuthenticated() {
      const token = getToken();

      if (!token) {
        window.location.href = '/paginas/login.html';
        return false;
      }

      const data = await requestJson('/api/auth/me');
      appState.authUser = data.user || null;
      localStorage.setItem(AUTH_USER_KEY, JSON.stringify(appState.authUser || {}));
      updateSessionUserLabel();
      return true;
    }

    function dashboardView() {
      const latestNoticias = [...appState.noticias]
        .sort((a, b) => new Date(b.fecha || 0) - new Date(a.fecha || 0))
        .slice(0, 3);

      const latestProyectos = [...appState.proyectos]
        .sort((a, b) => new Date(b.fecha_inicio || 0) - new Date(a.fecha_inicio || 0))
        .slice(0, 3);

      const totalItems = appState.noticias.length + appState.proyectos.length;

      return `
        <section class="grid gap-4 md:grid-cols-2 xl:grid-cols-4">
          <div class="card dashboard-kpi bg-white p-6 border border-slate-100">
            <div class="flex items-center justify-between gap-3">
              <div>
                <p class="text-sm text-slate-500">Noticias</p>
                <p class="mt-2 text-3xl font-bold text-slate-900">${appState.noticias.length}</p>
              </div>
              <div class="flex h-11 w-11 items-center justify-center rounded-2xl bg-emerald-50 text-emerald-600">
                <span class="material-symbols-outlined">article</span>
              </div>
            </div>
          </div>

          <div class="card dashboard-kpi bg-white p-6 border border-slate-100">
            <div class="flex items-center justify-between gap-3">
              <div>
                <p class="text-sm text-slate-500">Proyectos</p>
                <p class="mt-2 text-3xl font-bold text-slate-900">${appState.proyectos.length}</p>
              </div>
              <div class="flex h-11 w-11 items-center justify-center rounded-2xl bg-sky-50 text-sky-600">
                <span class="material-symbols-outlined">folder_open</span>
              </div>
            </div>
          </div>

          <div class="card dashboard-kpi bg-white p-6 border border-slate-100">
            <div class="flex items-center justify-between gap-3">
              <div>
                <p class="text-sm text-slate-500">Contenido total</p>
                <p class="mt-2 text-3xl font-bold text-slate-900">${totalItems}</p>
              </div>
              <div class="flex h-11 w-11 items-center justify-center rounded-2xl bg-amber-50 text-amber-600">
                <span class="material-symbols-outlined">auto_awesome</span>
              </div>
            </div>
          </div>

          <div class="card dashboard-kpi bg-white p-6 border border-slate-100 md:col-span-2 xl:col-span-1">
            <p class="text-sm text-slate-500">Estado</p>
            <p class="mt-2 text-lg font-semibold text-slate-900">Panel operativo</p>
            <p class="mt-2 text-sm text-slate-500">Publicación inmediata y edición simple para el sitio público.</p>
          </div>
        </section>

        <section class="grid gap-4 xl:grid-cols-[1.3fr_0.7fr]">
          <div class="card bg-white p-6 border border-slate-100">
            <div class="flex flex-col gap-2 md:flex-row md:items-center md:justify-between">
              <div>
                <p class="text-sm uppercase tracking-[0.24em] text-slate-400">Resumen operativo</p>
                <h2 class="mt-1 text-xl font-bold text-slate-900">Contenido en vivo</h2>
              </div>
              <span class="inline-flex rounded-full bg-emerald-50 px-3 py-1 text-xs font-semibold text-emerald-700">Actualizado</span>
            </div>

            <div class="mt-5 grid gap-4 md:grid-cols-2">
              <div class="rounded-2xl bg-slate-50 p-4">
                <div class="flex items-center justify-between gap-3">
                  <h3 class="text-sm font-semibold text-slate-700">Últimas noticias</h3>
                  <span class="text-xs text-slate-500">${latestNoticias.length} registros</span>
                </div>
                <div class="mt-3 space-y-2">
                  ${latestNoticias.map((item) => `
                    <div class="dashboard-list-item p-3">
                      <p class="text-sm font-semibold text-slate-900">${escapeHtml(item.titulo)}</p>
                      <p class="mt-1 text-xs text-slate-500">${formatDate(item.fecha)}</p>
                    </div>
                  `).join('') || '<p class="text-sm text-slate-500">No hay noticias cargadas todavía.</p>'}
                </div>
              </div>

              <div class="rounded-2xl bg-slate-50 p-4">
                <div class="flex items-center justify-between gap-3">
                  <h3 class="text-sm font-semibold text-slate-700">Últimos proyectos</h3>
                  <span class="text-xs text-slate-500">${latestProyectos.length} registros</span>
                </div>
                <div class="mt-3 space-y-2">
                  ${latestProyectos.map((item) => `
                    <div class="dashboard-list-item p-3">
                      <p class="text-sm font-semibold text-slate-900">${escapeHtml(item.nombre)}</p>
                      <p class="mt-1 text-xs text-slate-500">${formatDate(item.fecha_inicio)}</p>
                    </div>
                  `).join('') || '<p class="text-sm text-slate-500">No hay proyectos cargados todavía.</p>'}
                </div>
              </div>
            </div>
          </div>

          <aside class="card bg-white p-6 border border-slate-100">
            <p class="text-sm uppercase tracking-[0.24em] text-slate-400">Acciones rápidas</p>
            <h2 class="mt-1 text-xl font-bold text-slate-900">Gestión ágil</h2>
            <div class="mt-5 space-y-3">
              <a href="#" data-view="noticias" class="nav-link block rounded-2xl bg-emerald-600 px-4 py-3 text-sm font-semibold text-white text-center hover:bg-emerald-700">
                Gestionar noticias
              </a>
              <a href="#" data-view="proyectos" class="nav-link block rounded-2xl bg-sky-600 px-4 py-3 text-sm font-semibold text-white text-center hover:bg-sky-700">
                Gestionar proyectos
              </a>
              <div class="rounded-2xl bg-slate-50 p-4">
                <p class="text-sm font-semibold text-slate-800">Flujo recomendado</p>
                <p class="mt-2 text-sm text-slate-500">Actualiza contenido desde esta vista y el público lo verá al recargar la página correspondiente.</p>
              </div>
            </div>
          </aside>
        </section>
      `;
    }

    function richtextField({ name, id, value, placeholder, full }) {
      const listBtns = full
        ? `
          <span class="richtext-sep"></span>
          <button type="button" class="richtext-btn" data-cmd="formatBlock" data-value="H2" title="Título">H2</button>
          <button type="button" class="richtext-btn" data-cmd="formatBlock" data-value="H3" title="Subtítulo">H3</button>
          <button type="button" class="richtext-btn" data-cmd="formatBlock" data-value="P" title="Párrafo">P</button>
          <span class="richtext-sep"></span>
          <button type="button" class="richtext-btn" data-cmd="insertUnorderedList" title="Lista con viñetas">• Lista</button>
          <button type="button" class="richtext-btn" data-cmd="insertOrderedList" title="Lista numerada">1. Lista</button>
          <span class="richtext-sep"></span>
          <button type="button" class="richtext-btn" data-cmd="createLink" title="Insertar enlace">🔗 Enlace</button>
          <button type="button" class="richtext-btn" data-cmd="insertImage" title="Insertar imagen">🖼 Imagen</button>
          <button type="button" class="richtext-btn" data-cmd="deleteImage" title="Eliminar la imagen seleccionada">🗑 Quitar imagen</button>`
        : `
          <span class="richtext-sep"></span>
          <button type="button" class="richtext-btn" data-cmd="createLink" title="Insertar enlace">🔗 Enlace</button>`;

      return `
      <div class="richtext-wrapper mt-2" data-richtext-field="${name}">
        <div class="richtext-toolbar" data-richtext-toolbar>
          <button type="button" class="richtext-btn" data-cmd="bold" title="Negrita"><b>N</b></button>
          <button type="button" class="richtext-btn" data-cmd="italic" title="Cursiva"><i>K</i></button>
          <button type="button" class="richtext-btn" data-cmd="underline" title="Subrayado"><u>S</u></button>${listBtns}
          <span class="richtext-sep"></span>
          <button type="button" class="richtext-btn" data-cmd="removeFormat" title="Quitar formato">Limpiar</button>
        </div>

        <div id="${id}-editor" class="richtext-editor" contenteditable="true"
          data-placeholder="${escapeHtml(placeholder)}">${value || ''}</div>

        <textarea name="${name}" class="hidden" data-richtext-hidden required>${escapeHtml(value || '')}</textarea>
      </div>`;
    }

    function noticiaForm(model) {
      const data = model || {
        titulo: '',
        subtitulo: '',
        fecha: '',
        contenido: '',
        imagen_portada: '',
        id_categoria_noticia: ''
      };

      return `
    <input type="hidden" name="id" value="${escapeHtml(data.id || '')}" />

    <div>
      <label class="text-sm font-semibold text-slate-600">
        Título *
      </label>
      <input
        class="field mt-2"
        name="titulo"
        required
        value="${escapeHtml(data.titulo)}" />
    </div>

    <div>
      <label class="text-sm font-semibold text-slate-600">
        Bajada o Subtítulo *
      </label>

      ${richtextField({
        name: 'subtitulo',
        id: 'subtitulo',
        value: data.subtitulo,
        placeholder: 'Escribe una bajada breve. Selecciona el texto y usa la barra de arriba para darle formato.',
        full: false
      })}
    </div>

    <div>

    async function loadNoticias() {
      appState.noticias = await requestJson('/api/noticias');
    }

      appState.proyectos = await requestJson('/api/proyectos');
    }

    async function loadWebinars() {
      appState.webinars = await requestJson('/api/webinars');
    }

    async function loadData(view) {
      setStatus('Cargando datos...');
      if (view === 'dashboard' || view === 'noticias') {
        await loadNoticias();
      }
      if (view === 'dashboard' || view === 'proyectos') {
        await loadProyectos();
      }
      if (view === 'webinars') {
        await loadWebinars();
      }
      setStatus('Datos actualizados');
    }

    function rerenderPreservingScroll() {
      const scrollContainer = document.getElementById('webinars-scroll-container');
      const scrollTop = scrollContainer ? scrollContainer.scrollTop : 0;

      renderView();
      bindEvents();

      const restoredContainer = document.getElementById('webinars-scroll-container');
      if (restoredContainer) {
        restoredContainer.scrollTop = scrollTop;
      }
    }

    function resetEditing() {
      appState.editingNoticiaId = null;
      appState.editingProyectoId = null;
      appState.editingWebinarYoutubeId = null;
      rerenderPreservingScroll();
    }

    async function saveNoticia(form) {
      const data = Object.fromEntries(new FormData(form).entries());
      if (!data.titulo || !data.subtitulo || !data.fecha || !data.contenido || !data.imagen_portada || !data.id_categoria_noticia) {
        throw new Error('Todos los campos de noticia son obligatorios');
      }

      const endpoint = data.id ? `/api/noticias/${data.id}` : '/api/noticias';
      const method = data.id ? 'PUT' : 'POST';
      delete data.id;

      await requestJson(endpoint, {
        method,
        body: JSON.stringify(data),
      });

      await loadNoticias();
      appState.editingNoticiaId = null;
      renderView();
      bindEvents();
      setStatus('Noticia guardada');
    }

    async function saveProyecto(form) {
      const data = Object.fromEntries(new FormData(form).entries());
      if (!data.nombre || !data.descripcion || !data.fecha_inicio || !data.fecha_fin || !data.estado || !data.beneficiarios || !data.imagen) {
        throw new Error('Todos los campos de proyecto son obligatorios');
      }

      const endpoint = data.id ? `/api/proyectos/${data.id}` : '/api/proyectos';
      const method = data.id ? 'PUT' : 'POST';
      delete data.id;

      await requestJson(endpoint, {
        method,
        body: JSON.stringify(data),
      });

      await loadProyectos();
      appState.editingProyectoId = null;
      renderView();
      bindEvents();
      setStatus('Proyecto guardado');
    }

      const data = Object.fromEntries(new FormData(form).entries());

      if (!data.url_youtube) {
        throw new Error('El enlace de YouTube es obligatorio');
      }

      await requestJson(`/api/webinars/${data.id}/youtube`, {
        method: 'PUT',
        body: JSON.stringify({ url_youtube: data.url_youtube }),
      });

      await loadWebinars();
      rerenderPreservingScroll();
      setStatus('Enlace de YouTube guardado');

    function navigateWebinar(step) {
      const index = appState.webinars.findIndex((item) => String(item.id) === String(appState.editingWebinarYoutubeId));
      if (index === -1) return;

      const nextIndex = index + step;

      appState.editingWebinarYoutubeId = appState.webinars[nextIndex].id;
      rerenderPreservingScroll();

    function initRichTextEditor() {
      document.querySelectorAll('.richtext-wrapper').forEach(function (wrapper) {
        const editor = wrapper.querySelector('.richtext-editor');
        const hiddenField = wrapper.querySelector('[data-richtext-hidden]');
        const toolbar = wrapper.querySelector('[data-richtext-toolbar]');
        if (!editor || !hiddenField || !toolbar) return;

        function syncHidden() {
          hiddenField.value = editor.innerHTML;
        }

        // Mantiene sincronizado el HTML generado con el campo real que
        // se envía en el formulario, para que el backend siga recibiendo
        // el mismo string de HTML sin que el usuario escriba etiquetas.
        editor.addEventListener('input', syncHidden);
        syncHidden();

        // Selección de imágenes: clic sobre una imagen la marca (borde
        // verde) para poder eliminarla con el botón "Quitar imagen".
        editor.addEventListener('click', function (event) {
          editor.querySelectorAll('img.richtext-img-selected').forEach(function (img) {
            img.classList.remove('richtext-img-selected');
          });
          if (event.target.tagName === 'IMG') {
            event.target.classList.add('richtext-img-selected');
          }
        });

        toolbar.querySelectorAll('[data-cmd]').forEach(function (button) {
          // Evita que el navegador quite el foco/selección del editor al
          // pulsar un botón de la barra (causa habitual de que negrita,
          // listas, etc. parezcan "no funcionar").
          button.addEventListener('mousedown', function (event) {
            event.preventDefault();
          });

          button.addEventListener('click', function () {
            editor.focus();
            const cmd = button.dataset.cmd;
            let value = button.dataset.value || null;

            if (cmd === 'deleteImage') {
              const selectedImg = editor.querySelector('img.richtext-img-selected');
              if (!selectedImg) {
                alert('Primero haz clic sobre la imagen que quieres eliminar y luego presiona este botón.');
                return;
              }
              selectedImg.remove();
              syncHidden();
              return;
            }

            if (cmd === 'createLink') {
              const url = prompt('Pega el enlace (https://...):');
              if (!url) return;
              value = url;
            }

            if (cmd === 'insertImage') {
              const url = prompt('Pega la URL de la imagen (https://...):');
              if (!url) return;
              value = url;
            }

            document.execCommand(cmd, false, value);
            syncHidden();
          });
        });
      });
    }

    function initImageUploadFields() {
      document.querySelectorAll('[data-image-field]').forEach(function (wrapper) {
        const urlInput = wrapper.querySelector('input[name]');
        const fileInput = wrapper.querySelector('[data-image-file-input]');
        const statusEl = wrapper.querySelector('[data-image-status]');
        const previewWrap = wrapper.querySelector('[data-image-preview-wrap]');
        const previewImg = wrapper.querySelector('[data-image-preview]');
        const removeBtn = wrapper.querySelector('[data-image-remove]');
        if (!urlInput || !fileInput) return;

        function setStatus(text, kind) {
          if (!statusEl) return;
          statusEl.textContent = text;
          statusEl.className = 'image-upload-status' + (kind ? ` is-${kind}` : '');
        }

        function showPreview(url) {
          if (!previewWrap || !previewImg) return;
          if (!url) {
            previewWrap.style.display = 'none';
            previewImg.src = '';
            return;
          }
          previewImg.src = url;
          previewWrap.style.display = '';
        }

        // Si el usuario pega una URL a mano, actualiza la vista previa.
        urlInput.addEventListener('change', function () {
          showPreview(urlInput.value.trim());
        });

        removeBtn?.addEventListener('click', function () {
          urlInput.value = '';
          fileInput.value = '';
          showPreview('');
          setStatus('', null);
        });

        fileInput.addEventListener('change', async function () {
          const file = fileInput.files?.[0];
          if (!file) return;

          setStatus('Subiendo imagen…', 'uploading');

          try {
            const formData = new FormData();
            formData.append('imagen', file);

            const token = getToken();
            const response = await fetch('/api/upload', {
              method: 'POST',
              headers: token ? { Authorization: `Bearer ${token}` } : {},
              body: formData,
            });

            const result = await response.json().catch(function () { return null; });

            if (!response.ok) {
              throw new Error(result?.error || 'No se pudo subir la imagen');
            }

            urlInput.value = result.url;
            showPreview(result.url);
            setStatus('Imagen subida correctamente', 'success');
          } catch (error) {
            setStatus(error.message || 'Error al subir la imagen', 'error');
          } finally {
            fileInput.value = '';
          }
        });
      });
    }

    function bindEvents() {
      document.querySelectorAll('[data-edit-noticia]').forEach(function (button) {
        button.addEventListener('click', function () {
          editNoticia(button.dataset.editNoticia);
        });
      });

      document.querySelectorAll('[data-delete-noticia]').forEach(function (button) {
        button.addEventListener('click', function () {
          deleteNoticia(button.dataset.deleteNoticia);
        });
      });

      document.querySelectorAll('[data-edit-proyecto]').forEach(function (button) {
        button.addEventListener('click', function () {
          editProyecto(button.dataset.editProyecto);
        });
      });

      document.querySelectorAll('[data-edit-webinar-youtube]').forEach(function (button) {
        button.addEventListener('click', function () {
          editWebinarYoutube(button.dataset.editWebinarYoutube);
        });
      });

      document.querySelectorAll('[data-nav-webinar]').forEach(function (button) {
        button.addEventListener('click', function () {
          const step = button.dataset.navWebinar === 'next' ? 1 : -1;
          navigateWebinar(step);
        });
      });

      document.querySelectorAll('[data-delete-proyecto]').forEach(function (button) {
        button.addEventListener('click', function () {
          deleteProyecto(button.dataset.deleteProyecto);
        });
      });

      const noticiaFormEl = document.getElementById('noticia-form');
      if (noticiaFormEl) {
        noticiaFormEl.addEventListener('submit', async function (event) {
          event.preventDefault();
          try {
            await saveNoticia(noticiaFormEl);
          } catch (error) {
            alert(error.message);
          }
        });

        noticiaFormEl.querySelector('[data-reset-form]')?.addEventListener('click', resetEditing);
        initRichTextEditor();
        initImageUploadFields();
      }

      const proyectoFormEl = document.getElementById('proyecto-form');
      if (proyectoFormEl) {
        proyectoFormEl.addEventListener('submit', async function (event) {
          event.preventDefault();
          try {
            await saveProyecto(proyectoFormEl);
          } catch (error) {
            alert(error.message);
          }
        });

        proyectoFormEl.querySelector('[data-reset-form]')?.addEventListener('click', resetEditing);
      }

      const webinarYoutubeFormEl = document.getElementById('webinar-youtube-form');
      if (webinarYoutubeFormEl) {
        webinarYoutubeFormEl.addEventListener('submit', async function (event) {
          event.preventDefault();
          try {
            await saveWebinarYoutube(webinarYoutubeFormEl);
          } catch (error) {
            alert(error.message);
          }
        });

        webinarYoutubeFormEl.querySelector('[data-reset-form]')?.addEventListener('click', resetEditing);
      }
    }

    async function loadView(view) {
      appState.view = view;
      appState.editingNoticiaId = null;
      appState.editingProyectoId = null;
      appState.editingWebinarYoutubeId = null;
      await loadData(view);
      renderView();
      bindEvents();
    }

    navLinks.forEach(function (link) {
      link.addEventListener('click', async function (event) {
        event.preventDefault();
        await loadView(link.dataset.view);
      });
    });

    (async function init() {
      const authenticated = await ensureAuthenticated();

      if (!authenticated) {
        return;
      }

      await loadView('dashboard');
    })();
  </script>
</body>
